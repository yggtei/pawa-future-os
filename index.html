<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f7f7f7">
<title>SprintFit</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--g:#1de27a;--r:#ff5a5f;--b:#0fc4ff;--p:#6a2ee8;--k:#f87bff;--m:#9a9a9a;--t:#222}
html,body{height:100%;background:#f7f7f7;color:var(--t);font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;overflow:hidden}
#app{max-width:430px;margin:0 auto;height:100dvh;position:relative;overflow:hidden}
.pg,#sub{position:absolute;inset:0 0 74px;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 0 24px;display:none;-webkit-overflow-scrolling:touch}
.pg.on{display:block}
#sub{inset:0;background:#f7f7f7;z-index:6;padding-bottom:30px}
.pad{padding:0 16px}h1{font-size:28px;font-weight:800;padding:10px 16px 0}.sd{color:var(--m);font-size:16px;padding:0 16px;margin-top:2px}
.card{background:#fff;border-radius:28px;margin:0 0 16px;padding:20px 20px}.card.f{border-radius:28px 28px 0 0;margin-bottom:0}
.card.gr{background:linear-gradient(#e9fff3,#fff 55%)}
.card h2{font-size:23px;font-weight:800;margin-bottom:12px}
.seg{display:flex;justify-content:space-between;padding:14px 16px 10px;position:relative}
.seg b{flex:1;text-align:center;font-size:19px;color:var(--m);padding:12px 0;border-radius:14px;font-weight:700}
.seg b.on{background:var(--g);color:#fff;box-shadow:0 8px 20px rgba(29,226,122,.35);max-width:80px;margin-right:auto}
.seg.pu b.on{background:var(--p);box-shadow:0 8px 20px rgba(106,46,232,.35)}
.seg b{max-width:80px}.seg{gap:0}.seg b:nth-child(2){margin:0 auto}.seg b:nth-child(3){margin-left:auto;margin-right:24px}
.row3{display:flex;justify-content:space-around;text-align:center;margin-top:18px}
.st .sl{color:var(--m);font-size:17px;font-weight:600}.st .sv{font-size:28px;font-weight:800;margin:6px 0;display:flex;gap:8px;align-items:center;justify-content:center}
.sv svg{width:22px;height:22px}
.ah{display:flex;align-items:center;gap:12px;margin-bottom:8px}.ai{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#17ea6e,#10d79a);display:flex;align-items:center;justify-content:center}
.ai svg{width:26px;height:26px}.ah b{font-size:25px;font-weight:800}.ah small{display:block;color:#c8c8c8;font-size:14px;font-weight:600;margin-top:2px}
.wk{display:flex;justify-content:space-between;margin:18px 0 6px;text-align:center}.wk div{font-size:14px;color:var(--m);font-weight:700;display:flex;flex-direction:column;gap:8px;align-items:center}
.wk div.on{color:#fff}.wk div.on span{background:var(--g);padding:3px 11px;border-radius:99px}
.big{font-size:70px;font-weight:800;line-height:1}.big small,.mid small{font-size:18px;font-weight:600}
.mid{font-size:42px;font-weight:800}.c{text-align:center}.v{display:flex;align-items:center;gap:6px}
.wr{display:flex;justify-content:space-around;margin-top:20px;font-size:17px}.wr div{display:flex;flex-direction:column;gap:2px;align-items:center}
.wr .l{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:800}.wr .l i{width:34px;height:34px;border-radius:50%;background:#ffe9df;display:inline-block;border:8px solid #ffe9df;position:relative}
.wr .l i:after{content:"";position:absolute;inset:-1px;border-radius:50%;background:#ff7a45}
.sub2{color:#9a9a9a;font-size:20px;margin:2px 0 14px}
.tile{display:flex;justify-content:space-between;gap:12px;margin-top:6px}.tile>div{flex:1;background:#f7f7f7;border-radius:20px;padding:16px;min-height:96px}
.tile small{color:#555;font-size:17px;display:block;margin-bottom:12px}.tile b{font-size:34px;font-weight:800}.tile b i{font-size:18px;font-style:normal;font-weight:600}
.lg{display:flex;justify-content:space-between;font-size:17px;color:#777;margin:12px 0 4px}.lg i{display:inline-block;width:16px;height:16px;border-radius:50%;margin-right:7px;vertical-align:-2px}
.xl{display:flex;justify-content:space-between;color:#222;font-size:17px;font-weight:600}
.bar{height:26px;border-radius:99px;background:linear-gradient(90deg,#9cc6ee,#d6b6e6 50%,#5a12e0);position:relative;margin:30px 0 14px}.bar:after{content:"";position:absolute;top:2px;left:var(--x);width:44px;height:44px;margin-top:-9px;border-radius:50%;background:rgba(255,255,255,.9)}
.rt{display:flex;justify-content:space-between;font-weight:700;font-size:18px}.rt span{color:#aaa;font-weight:600}
.hd{display:flex;justify-content:space-between;align-items:center}.q{width:42px;height:42px;border-radius:50%;background:#ddd;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px 16px}.grid2 .card{margin:0;text-align:center;padding:30px 10px}
.grid2 .card b{display:block;font-size:26px;margin-top:20px;font-weight:600}.grid2 small{color:var(--m);font-size:20px;font-weight:600}
.ph{height:248px;border-radius:26px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;font-size:25px;font-weight:800;line-height:1.2}.ph small{font-size:22px;font-weight:600;margin-top:6px}
nav{position:absolute;left:0;right:0;bottom:0;height:74px;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;align-items:flex-start;padding:14px 0 0;z-index:5}
nav button{background:none;border:0;width:60px;height:46px;color:#c4c4c4;display:flex;justify-content:center}nav button.on{color:var(--g)}nav svg{width:34px;height:34px;fill:currentColor}
.dev{background:#fff;border-radius:0 0 28px 28px;padding:24px 22px 22px;display:flex;justify-content:space-between;margin-bottom:16px}
.dev h1{padding:0;font-size:54px;line-height:1.05;font-weight:800;max-width:230px;word-break:break-all}.dev p{margin-top:8px;font-size:21px;letter-spacing:.3px}
.bt{display:inline-block;background:#eee;color:#999;font-weight:700;padding:20px 30px;border-radius:14px;font-size:24px;margin-top:20px}.bt.gn{background:var(--g);color:#fff}
.menu{background:#fff;border-radius:28px 28px 0 0;padding:0 20px;margin-top:16px}.mi{display:flex;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid #ececec;font-size:27px;font-weight:500}.mi:last-child{border:0}
.mi i{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:28px;flex:none}
.back{padding:calc(env(safe-area-inset-top) + 14px) 18px 6px;font-size:40px;line-height:1;color:#222}
.set{background:#fff;border-radius:28px;margin-bottom:16px;padding:6px 20px}.sr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;border-bottom:1px solid #eee;font-size:25px}.sr:last-child{border:0}
.sr small{display:block;color:#999;font-size:17px;font-weight:500;margin-top:4px}.sr em{color:#999;font-style:normal;font-size:20px}.sr em:after{content:" ›";font-size:34px;color:#888;vertical-align:-3px}
.tg{width:66px;height:44px;border-radius:99px;background:#e6e6e6;position:relative;flex:none;transition:.2s}.tg:after{content:"✕";position:absolute;left:3px;top:3px;width:38px;height:38px;border-radius:50%;background:#fff;color:#ccc;font-size:18px;display:flex;align-items:center;justify-content:center;transition:.2s}
.tg.on{background:var(--g)}.tg.on:after{content:"✓";left:25px;color:var(--g);border:2px solid var(--g)}
.ic{width:46px;height:46px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:22px;margin-right:16px}.sr .n{display:flex;align-items:center}
.pf{display:flex;justify-content:space-between;padding:34px 0;border-bottom:1px solid #e6e6e6;font-size:31px}.pf b{color:var(--g);font-weight:600}
.gs{display:flex;justify-content:space-between;align-items:center;padding:30px 0;border-bottom:1px solid #eee;font-size:27px}.gs .bx{border:3px solid var(--g);color:var(--g);border-radius:12px;padding:6px 26px;font-size:42px;margin-right:12px}.gs em{color:var(--g);font-style:normal;font-size:27px}
.fh{display:flex;justify-content:space-between;align-items:center;height:162px;font-size:29px;border-bottom:1px solid #eee}.ct{text-align:center;padding-top:150px}.btn{display:block;background:var(--g);color:#fff;font-size:28px;font-weight:700;padding:30px;border-radius:26px;margin:0 28px;text-align:center;box-shadow:0 8px 24px rgba(29,226,122,.25)}
#log{background:#04140b;color:#7dffb4;font:12px/1.7 ui-monospace,Menlo,monospace;height:220px;overflow-y:auto;border-radius:14px;padding:10px;direction:ltr}
#modal{position:fixed;inset:0;background:rgba(60,0,10,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:99;color:#fff;text-align:center;padding:30px}#modal.on{display:flex}
#cd{font-size:110px;font-weight:900;color:#ff5a5f}#modal button{font-size:26px;padding:20px 50px;border:0;border-radius:20px;background:var(--g);color:#fff;font-weight:800;margin-top:20px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:99px;font-size:15px;opacity:0;transition:.3s;z-index:50;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}
</style>
</head>
<body>
<div id="app">
<div class="pg on" id="p0"></div><div class="pg" id="p1"></div><div class="pg" id="p2"></div><div class="pg" id="p3"></div><div class="pg" id="p4"></div>
<div id="sub"></div>
<nav id="nav">
<button class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><circle cx="17" cy="7" r="4"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></button>
<button><svg viewBox="0 0 24 24"><circle cx="15" cy="4" r="2.3"/><path d="M12 7l-4 2-2 4 1.6.8L9 11l2 1-3 5-4 3 1 1.4 5-2.6 2-3 2 3v5h2v-6l-2.4-3.6 1.4-3 3 2.6 1.2-1.4-4-4z"/></svg></button>
<button><svg viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/><path d="M17 3l.8 1.7L19.5 5.5l-1.7.8L17 8l-.8-1.7L14.5 5.5l1.7-.8z"/></svg></button>
<button><svg viewBox="0 0 24 24"><path d="M4 20c0-9 5-15 16-15 0 11-6 16-14 16l-1.5 2-1.5-1 2-2.5C5 19 4 20 4 20z"/></svg></button>
<button><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="4.5"/><path d="M3 21c0-4.5 4-7 9-7s9 2.500 9 7z"/></svg></button>
</nav>
</div>
<div id="modal"><div style="font-size:60px">🚨</div><h2 dir="rtl">لم نعد نلتقط نبضك!</h2><p id="mr" dir="rtl" style="color:#ffb3bf;margin:8px 0"></p><div id="cd">30</div><p dir="rtl" style="color:#ffb3bf">ثانية قبل إرسال الاستغاثة مع موقعك</p><button onclick="cancelEm()" dir="rtl">أنا بخير</button></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const G='#1de27a',R='#ff5a5f',B='#0fc4ff',P='#6a2ee8',K='#f87bff',MG='#0fffa0';
const D={steps:2960,cal:202,dur:23,gs:8000,gc:300,gd:30};
const S=Object.assign({call:1,msg:1,mail:0,fb:0,ig:1,line:0,qq:0,wechat:0,wa:1,x:0,oth:0,move:1,lowb:1,stress:1,whr:0,spo:1,mens:1,exday:0,red:1,thr:20,num:'',iv:'30Min',vib:'Soft'},JSON.parse(localStorage.getItem('sf')||'{}'));
const sv=()=>{try{localStorage.setItem('sf',JSON.stringify(S))}catch(e){}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200)};
const log=m=>{const l=$('#log');if(l){l.insertAdjacentHTML('beforeend',`[${new Date().toLocaleTimeString('en-GB')}] ${m}<br>`);l.scrollTop=l.scrollHeight}(log.h=log.h||[]).push(m)};
/* ---------- drawing helpers ---------- */
const ring=(a,s=280)=>`<svg viewBox="0 0 280 280" width="${s}" height="${s}" style="display:block;margin:auto">`+[[125,G,a[0]],[100,R,a[1]],[75,B,a[2]]].map(([r,c,v])=>{const L=2*Math.PI*r;return `<circle cx="140" cy="140" r="${r}" fill="none" stroke="#eee" stroke-width="22"/><circle cx="140" cy="140" r="${r}" fill="none" stroke="${c}" stroke-width="22" stroke-linecap="round" stroke-dasharray="${L*Math.min(v,1)} ${L}" transform="rotate(-90 140 140)"/>`}).join('')+'</svg>';
const rr=[D.steps/D.gs,D.cal/D.gc,D.dur/D.gd];
const FT='<svg viewBox="0 0 24 24"><ellipse cx="7" cy="14" rx="3" ry="5" fill="'+G+'"/><ellipse cx="16" cy="9" rx="3" ry="5" fill="'+G+'"/></svg>';
const FL='<svg viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-6 1 2 2 2 2 2 0-3-1-5 1-8z" fill="'+R+'"/></svg>';
const CK='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="'+B+'"/><path d="M12 6v6h5" stroke="#fff" stroke-width="2.500" fill="none"/></svg>';
const st3=()=>`<div class="row3"><div class="st"><div class="sl">Steps</div><div class="sv">${FT}${D.steps}</div><div class="sl">/${D.gs} steps</div></div><div class="st"><div class="sl">Calories</div><div class="sv">${FL}${D.cal}</div><div class="sl">/${D.gc} kCal</div></div><div class="st"><div class="sl">Duration</div><div class="sv">${CK}${D.dur}</div><div class="sl">/${D.gd} Min</div></div></div>`;
const seg=(c='')=>`<div class="seg ${c}"><b class="on">Day</b><b>Week</b><b>Month</b></div>`;
const sm=pts=>{let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=0;i<pts.length-1;i++){const a=pts[i-1]||pts[i],b=pts[i],c=pts[i+1],e=pts[i+2]||c;d+=` C${b[0]+(c[0]-a[0])/6},${b[1]+(c[1]-a[1])/6} ${c[0]-(e[0]-b[0])/6},${c[1]-(e[1]-b[1])/6} ${c[0]},${c[1]}`}return d};
const area=(pts,col,fill,h=120,w=340)=>{const d=sm(pts);return `<svg viewBox="0 0 ${w} ${h}" width="100%"><defs><linearGradient id="a${col.slice(1)}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${fill}" stop-opacity=".5"/><stop offset="1" stop-color="${fill}" stop-opacity="0"/></linearGradient></defs><path d="${d} L${w},${h} L0,${h}Z" fill="url(#a${col.slice(1)})"/><path d="${d}" fill="none" stroke="${col}" stroke-width="3"/></svg>`};
const ws=['Sat','Sun','Mon','Tue','Wed','Thu','Fri'],wd=[[.3,.8,.8],[.15,.9,.9],[.2,1,1],[.2,1,1],[.2,1,1],[1,1,1],rr];
const hrBars=()=>{const a=[[.1,430],[5,40],[10.2,300],[10.8,480],[11.4,480],[12,582],[12.6,200],[13.1,330],[13.6,290]];return `<svg viewBox="0 0 340 170" width="100%"><g stroke="#eee" stroke-dasharray="3 4">${[10,52,94].map(y=>`<line x1="28" x2="340" y1="${y}" y2="${y}"/>`).join('')}</g><line x1="28" x2="340" y1="132" y2="132" stroke="${G}" stroke-width="2"/>${a.map(([x,v])=>`<rect x="${30+x*12.3}" y="${132-v/582*122}" width="4" height="${v/582*122}" rx="2" fill="${G}"/>`).join('')}<g fill="#bbb" font-size="12"><text x="0" y="14">582</text><text x="0" y="56">388</text><text x="0" y="98">194</text><text x="8" y="136">0</text>${['00:00','06:00','12:00','18:00','24:00'].map((t,i)=>`<text x="${14+i*78}" y="160">${t}</text>`).join('')}</g></svg>`};
const stages=()=>{const L='2223322112223322210022233332200122223311222002223322',c=[MG,B,K,P],y=[0,34,64,98];return `<svg viewBox="0 0 340 150" width="100%">`+[...L].map((v,i)=>`<rect x="${i*6.4}" y="${y[v]}" width="5.600" height="${v==0?40:52}" rx="3" fill="${c[v]}"/>`).join('')+`</svg>`};
const lgs=`<div class="lg"><span><i style="background:${P}"></i>Deep</span><span><i style="background:${K}"></i>Light</span><span><i style="background:${B}"></i>REM</span><span><i style="background:${MG}"></i>Awake</span></div>`;
const trend=()=>{const d=[[55,190,75,28,35],[10,105,45,25,0],[25,95,50,15,0],[55,75,25,18,0],[28,100,85,5,0],[40,125,45,5,65],[52,100,52,105,0]],dts=['10/17','10/18','10/19','10/20','10/21','10/22','10/23'],col=[P,K,B,MG,'#fa9ffc'];return `<svg viewBox="0 0 340 250" width="100%">`+d.map((a,i)=>{let y=205;return a.map((h,j)=>{if(!h)return'';y-=h*.8;return `<rect x="${i*49+12}" y="${y}" width="22" height="${h*.8+(j?0:0)}" rx="${j==0||j==4?11:0}" fill="${col[j]}"/>`}).join('')+`<text x="${i*49+5}" y="238" fill="#999" font-size="14">${dts[i]}</text>`}).join('')+`<line x1="0" x2="340" y1="206" y2="206" stroke="${P}" stroke-width="2"/></svg>`};
const sp=(a,b)=>`<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="${b}"/><circle cx="17" cy="17" r="5" fill="${a}"/></svg>`;
/* ---------- pages ---------- */
const hr=new Date().getHours(),dn=new Date(),mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],dy=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const greet=hr<12?'MORNING':hr<18?'AFTERNOON':'EVENING';
const dstr=`${dn.getDate()} ${mo[dn.getMonth()]}. ${dy[dn.getDay()]}`,dfull=`${dn.getDate()} ${mo[dn.getMonth()]}. ${dn.getFullYear()}, ${dy[dn.getDay()]}`;
const P0=()=>`<div class="pad"><div style="margin-top:44px;font-size:19px">${dstr}</div><div style="font-size:50px;font-weight:800;line-height:1.1;margin:10px 0 28px">GOOD<br>${greet}!</div>
<div class="card gr"><div class="ah"><div class="ai"><svg viewBox="0 0 24 24"><circle cx="15" cy="4" r="2.300" fill="#fff"/><path fill="#fff" d="M12 7l-4 2-2 4 1.600.8L9 11l2 1-3 5-4 3 1 1.400 5-2.600 2-3 2 3v5h2v-6l-2.400-3.600 1.400-3 3 2.600 1.200-1.400-4-4z"/></svg></div><div><b>Activity</b><small>${dfull}, ${String(hr%12||12).padStart(2,'0')}:30 ${hr<12?'AM':'PM'}</small></div></div>${ring(rr,190)}${st3()}</div>
<div class="card gr" style="min-height:330px"><div class="ah"><div class="ai" style="background:linear-gradient(135deg,#2ad07a,#3ce790)"><svg viewBox="0 0 24 24"><path fill="#fff" d="M3 4h9l9 9-8 8-9-9z"/></svg></div><b>Daily Tag</b></div><div class="c" style="margin-top:34px"><svg width="110" viewBox="0 0 100 100"><path d="M50 8l38 28-14 46H26L12 36z" fill="#dcdfdf"/><path d="M50 22l26 20-9 32H33l-9-32z" fill="#fff"/><path d="M50 40l12 9-4 14H42l-4-14z" fill="#e8e8e8"/></svg><div style="color:#aaa;font-size:31px;font-weight:800;margin-top:36px;line-height:1.3">Please fill in the<br>Daily Tags</div></div></div></div>`;

  try{const s=await st.srv.getPrimaryService('battery_service'),c=await s.getCharacteristic('battery_level'),u=v=>{const p=v.getUint8(0);$('#dBat').firstChild.textContent=p+'% ';$('#dBar').style.width=p+'%'};u(await c.readValue());await c.startNotifications();c.addEventListener('characteristicvaluechanged',e=>u(e.target.value));log('Battery OK')}catch(e){log('No standard battery service')}
  try{const s=await st.srv.getPrimaryService('heart_rate'),c=await s.getCharacteristic('heart_rate_measurement');await c.startNotifications();c.addEventListener('characteristicvaluechanged',e=>pHR(e.target.value));log('Heart rate OK')}catch(e){log('No standard HR service: '+e.message)}
  try{const s=await st.srv.getPrimaryService(0x1822),c=await s.getCharacteristic(0x2A5F);await c.startNotifications();c.addEventListener('characteristicvaluechanged',e=>{const v=e.target.value.getUint16(1,true);let m=v&4095;if(m>=2048)m-=4096;let x=v>>12;if(x>=8)x-=16;st.spo=Math.round(m*10**x);live()});log('SpO2 OK')}catch(e){log('No standard SpO2 service')}
 }catch(e){log('Connect failed: '+e.message);st.conn=false;upd()}}
function pHR(dv){const f=dv.getUint8(0);let h=f&1?dv.getUint16(1,true):dv.getUint8(1);st.contactSup=!!(f&4);st.contact=st.contactSup?!!(f&2):null;st.hr=h;st.last=Date.now();live()}
function live(){$('#dLive').textContent=`♥ ${st.hr||'--'} BPM`+(st.spo?`  ·  SpO₂ ${st.spo}%`:'')}
function onDisc(){st.conn=false;upd();log('Disconnected (not treated as emergency)');let n=0;const t=async()=>{if(st.conn||n>=6)return;n++;log('Reconnect #'+n);await link();if(!st.conn)setTimeout(t,3000*n)};setTimeout(t,2000)}
function disc(){const d=st.dev;st.dev=null;if(d&&d.gatt.connected){d.removeEventListener('gattserverdisconnected',onDisc);d.gatt.disconnect()}st.conn=false;upd();log('Removed by user')}
/* ---------- red line ---------- */
setInterval(()=>{if(!st.conn){st.lost=0;return}const now=Date.now(),age=(now-st.last)/1000;
 if(st.contactSup&&st.contact===false){st.lost=0;return}
 if(st.hr>0&&age<15){st.lost=0;return}
 if(!st.lost)st.lost=now;const l=(now-st.lost)/1000;if(S.red&&l>=S.thr&&!st.em&&(st.contactSup&&st.contact))trigger('Skin contact with no pulse for '+Math.round(l)+'s')},1000);
let ac;const beep=()=>{try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=980;o.connect(g);g.connect(ac.destination);g.gain.value=.3;o.start();o.stop(ac.currentTime+.35)}catch(e){}};
let tm,cnt;function trigger(w){if(st.em)return;st.em=true;cnt=30;$('#cd').textContent=cnt;$('#mr').textContent=w;$('#modal').classList.add('on');log('ALERT: '+w);const k=()=>{navigator.vibrate&&navigator.vibrate([500,150,500]);beep()};k();tm=setInterval(()=>{cnt--;$('#cd').textContent=cnt;k();if(cnt<=0){clearInterval(tm);send()}},1000)}
function cancelEm(){clearInterval(tm);st.em=false;st.lost=0;$('#modal').classList.remove('on');log('User: I am OK')}
function send(){const go=l=>{const m='SOS from SprintFit: vital signs stopped.'+(l?' https://maps.google.com/?q='+l:'');if(S.num)location.href='sms:'+S.num+'?&body='+encodeURIComponent(m);else if(navigator.share)navigator.share({text:m}).catch(()=>{});$('#modal').classList.remove('on');st.em=false;st.lost=0};navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude+','+p.coords.longitude),()=>go(''),{timeout:6000}):go('')}
</script>
